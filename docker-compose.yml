x-llama-common: &llama-common
  restart: unless-stopped
  ports:
    - "6969:6969"
  volumes:
    - ./data/models:/models

services:
# docker compose build smlq_sfw_tgbog
# docker compose --profile tg run --rm smlq_sfw_tgbog
  smlq_sfw_tgbog:
    profiles:
      - tg
    build: .
    image: smlq_sfw_tgbog
    container_name: smlq_sfw_tgbog
    restart: unless-stopped
    environment:
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
    volumes:
      - tdlib_session:/app/tdlib_db
      - ./data/user:/app/user

  smlq_llamacpp:
    <<: *llama-common
    profiles:
      - cpu
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: smlq_llamacpp
    command: >
      --server
      --host 0.0.0.0
      --port 6969
      --image-min-tokens 1024
      --mmproj /models/mmproj-F16.gguf
      --perf
      -t 8
      -tb 8
      -m /models/Huihui-Qwen3-VL-8B-Instruct-abliterated-Q4_K_M.gguf
      -b 256
      -ub 128
      --ctx-size 8192

  smlq_fast:
    <<: *llama-common
    profiles:
      - gpu
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    container_name: smlq_fast
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --server
      --host 0.0.0.0
      --port 6969
      --image-min-tokens 1024
      --mmproj /models/mmproj-F16.gguf
      --perf
      -t 8
      -tb 8
      -b 2048
      -ub 512
      --gpu-layers 99
      --ctx-size 32768
      -m /models/Huihui-Qwen3-VL-8B-Instruct-abliterated-Q8_0.gguf
#      -m /models/Huihui-Qwen3-VL-8B-Instruct-abliterated-Q4_K_M.gguf

volumes:
  tdlib_session: